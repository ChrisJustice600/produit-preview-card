name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          A352BB: ${{ secrets.A352BB }}
          B23CAF: ${{ secrets.B23CAF }}
        run: |
          python3 -c "
          import pathlib, os, sys
          sec_a = os.environ.get('A352BB', '')
          sec_b = os.environ.get('B23CAF', '')
          target = pathlib.Path('index.html')
          before = target.read_text(encoding='utf-8')
          after = before
          if sec_a:
              after = after.replace('<!-- bea3a341fcbf3b1363dc -->', sec_a)
          if sec_b:
              after = after.replace('<!-- bfab3a2d13c7431d34d37917c14c559099f528 -->', sec_b)
          if after == before and (sec_a or sec_b):
              sys.exit(1)
          if after != before:
              target.write_text(after, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
